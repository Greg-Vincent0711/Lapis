AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lapis backend: DynamoDB table, S3 bucket for images and Lambda code, the DB Lambda behind an
  HTTP API with a Cognito JWT authorizer, the seed-tools Lambda, and the Discord bot on EC2.
  Deploy with ./deploy.sh.

# Things CloudFormation does NOT create, and why:
#   - The Fernet encryption key (Secrets Manager secret named by FernetSecretName). Every saved
#     location is encrypted with it; if a stack change ever deleted it, all data would be unreadable.
#   - The Cognito user pool the website signs in with.
#   - The Lambda layer holding the Python dependencies.
# They are passed in as parameters instead.

Parameters:
  DBCodeKey:
    Type: String
    Description: S3 key of the DB Lambda zip in the stack's bucket (deploy.sh uploads it with a unique name).
  SeedCodeKey:
    Type: String
    Description: S3 key of the seed Lambda zip in the stack's bucket.
  DependenciesLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:444277859488:layer:lambda-dependencies:1
    Description: Layer with requests, cryptography, attrs, aws-secretsmanager-caching (built for arm64).
  FernetSecretName:
    Type: String
    Default: LapisFernetSecret
  CognitoUserPoolId:
    Type: String
    Default: us-east-1_ytzLAQXvz
  CognitoAppClientId:
    Type: String
    Default: 4fv4br59s8ub1gt7hmmhkfi5sv
    Description: The website's Cognito app client; API Gateway only accepts ID tokens issued to it.
  DiscordClientId:
    Type: String
    Default: "1342331009336868915"
  DiscordClientSecret:
    Type: String
    NoEcho: true
    Description: Discord OAuth client secret. Never commit it; deploy.sh reads it from .env.
  DiscordRedirectUri:
    Type: String
    Default: http://localhost:5173/auth/callback
    Description: Must match the redirect the website sends to Discord and the Discord developer portal.
  SiteOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://localhost:5174,http://localhost:5175
    Description: Origins the browser may call the API from. Add the website's domain when it's hosted.
  DiscordBotToken:
    Type: String
    NoEcho: true
    Description: The bot's Discord token. Never commit it; deploy.sh reads TOKEN from .env.
  BotInstanceType:
    Type: String
    Default: t4g.micro
    # Graviton (ARM) only: the bundled inputHandler is a Linux ARM build, the same one Lambda runs
    AllowedValues: [t4g.nano, t4g.micro, t4g.small, t4g.medium]
  BotImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    # always the newest Amazon Linux 2023 ARM image; a newer image replaces the instance on the next deploy
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  # ---------- storage ----------
  LapisCodeAndImages:
    Type: AWS::S3::Bucket
    # holds every uploaded image; never delete it along with the stack
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "lapis-memory-${AWS::AccountId}"
      # Leave this line exactly as is. The stack was created with it; removing it makes CloudFormation
      # try to reset the bucket's ACL, which fails because ACLs are disabled (BucketOwnerEnforced).
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # ACLs are off; only the bucket policy below makes anything public
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      LifecycleConfiguration:
        Rules:
          # versioning keeps a hidden copy of every replaced or deleted file; drop those after 30 days
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  LapisImagesPublicRead:
    Type: AWS::S3::BucketPolicy
    # imported into the stack on 2026-11-10 (it was created by hand first)
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref LapisCodeAndImages
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # images are shown in Discord embeds and on the website, so uploads/ is readable by URL.
          # Lambda code zips (lambda/) stay private.
          - Sid: AllowPublicReadAccessToUploads
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${LapisCodeAndImages.Arn}/uploads/*"

  LapisTable:
    Type: AWS::DynamoDB::Table
    # every user's saved locations live here; it must survive any stack mistake
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: LapisData
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: Author_ID
          AttributeType: S
        - AttributeName: Location
          AttributeType: S
        - AttributeName: cognito_user_id
          AttributeType: S
      KeySchema:
        - AttributeName: Author_ID
          KeyType: HASH
        - AttributeName: Location
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # finds a website user's Discord id from their Cognito id
        - IndexName: cognito-index
          KeySchema:
            - AttributeName: cognito_user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # ---------- permissions (least privilege) ----------
  LapisDBLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LapisDBLambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LapisPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/LapisDBFn:*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt LapisTable.Arn
                  - !Sub "${LapisTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${LapisCodeAndImages.Arn}/uploads/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FernetSecretName}*"

  LapisSeedLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LapisSeedLambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LapisSeedPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/LapisSeedFn:*"
              # only reads the user's saved seed
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt LapisTable.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FernetSecretName}*"

  # ---------- Lambda functions ----------
  LapisDBFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LapisDBFn
      Description: Saved locations, images, seeds and Discord linking for the website (HTTP API).
      Runtime: python3.11
      Architectures: [arm64]
      Handler: src/lapis/api/db_lambda.handler
      Role: !GetAtt LapisDBLambdaRole.Arn
      # API Gateway gives up after 30 seconds, so a longer Lambda timeout would only waste time
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref DependenciesLayerArn
      Environment:
        Variables:
          TABLE_NAME: !Ref LapisTable
          BUCKET_NAME: !Ref LapisCodeAndImages
          SECRET_NAME: !Ref FernetSecretName
          CLIENT_ID: !Ref DiscordClientId
          CLIENT_SECRET: !Ref DiscordClientSecret
          REDIRECT_URI: !Ref DiscordRedirectUri
      Code:
        S3Bucket: !Ref LapisCodeAndImages
        S3Key: !Ref DBCodeKey

  LapisSeedFn:
    Type: AWS::Lambda::Function
    # Not routed through API Gateway: the Discord bot runs the seed tools itself. Kept deployed so a
    # JWT-protected route can be added later without rebuilding anything.
    Properties:
      FunctionName: LapisSeedFn
      Description: Runs the cubiomes seed tools (nearest biome/structure, spawn-near) on a user's seed.
      Runtime: python3.11
      # the bundled inputHandler binary is built for Linux ARM
      Architectures: [arm64]
      Handler: src/lapis/api/seed_lambda.handler
      Role: !GetAtt LapisSeedLambdaRole.Arn
      Timeout: 20
      # Lambda CPU scales with memory; the C searches need the extra speed
      MemorySize: 1024
      Layers:
        - !Ref DependenciesLayerArn
      Environment:
        Variables:
          TABLE_NAME: !Ref LapisTable
          SECRET_NAME: !Ref FernetSecretName
          EXECUTABLE_NAME: ./src/lapis/inputHandler
      Code:
        S3Bucket: !Ref LapisCodeAndImages
        S3Key: !Ref SeedCodeKey

  LapisDBFnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LapisDBFn}"
      RetentionInDays: 14

  LapisSeedFnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LapisSeedFn}"
      RetentionInDays: 14

  # ---------- HTTP API ----------
  # Replaced the hand-built LapisHttpApi (ccuvznal88) on 2026-11-10 so every route lives in this file.
  LapisApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: LapisApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref SiteOrigins
        AllowCredentials: true
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization, x-requested-with]
        MaxAge: 600

  # every route requires a valid Cognito ID token issued to the website's app client
  LapisAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref LapisApi
      Name: LapisAuth
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
        Audience:
          - !Ref CognitoAppClientId

  DBIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LapisApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LapisDBFn.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  ListLocationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "GET /locations"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  SaveLocationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "POST /locations"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  GetLocationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "GET /locations/{location_name}"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  UpdateLocationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "PUT /locations/{location_name}"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  DeleteLocationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "DELETE /locations/{location_name}"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  SaveImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "PUT /locations/{location_name}/img"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  DeleteImageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "DELETE /locations/{location_name}/img"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  GetSeedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "GET /seed"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  SetSeedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "POST /seed"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  # links a signed-in website user to their Discord account (the JWT says who they are)
  DiscordCallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LapisApi
      RouteKey: "POST /auth/callback"
      AuthorizationType: JWT
      AuthorizerId: !Ref LapisAuthorizer
      Target: !Sub "integrations/${DBIntegration}"

  LapisHttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref LapisApi
      StageName: prod
      # route and CORS changes go live as soon as the stack updates
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  LapisDBFnInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LapisDBFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LapisApi}/*/*/*"

  # --------- EC2 ----------
  LapisBotTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: LapisBotToken
      Description: Discord bot token, read by the bot at startup so it never sits on the instance's disk.
      SecretString: !Ref DiscordBotToken

  LapisBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LapisBotRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager shell access and the Run Command deploy.sh uses to update the bot
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: LapisBotPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt LapisTable.Arn
                  - !Sub "${LapisTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${LapisCodeAndImages.Arn}/uploads/*"
              # the bot's code bundle, uploaded by deploy.sh
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${LapisCodeAndImages.Arn}/bot/*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${FernetSecretName}*"
                  - !Ref LapisBotTokenSecret

  LapisBotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref LapisBotRole]

  LapisBotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lapis bot - nothing inbound; HTTPS out to Discord, AWS APIs and package mirrors
      # no SecurityGroupIngress: the bot only makes outbound connections
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  LapisBotLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref BotImageId
        InstanceType: !Ref BotInstanceType
        IamInstanceProfile:
          Arn: !GetAtt LapisBotInstanceProfile.Arn
        SecurityGroupIds: [!GetAtt LapisBotSecurityGroup.GroupId]
        MetadataOptions:
          # IMDSv2 only: credentials can't be stolen through a simple request-forgery bug
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: lapis-bot
        # Runs once, on the instance's first boot. Editing it makes a new launch template version,
        # which replaces the instance, so changes here always take effect.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y python3.11 python3.11-pip unzip aws-cfn-bootstrap
            # tell CloudFormation if anything below fails, so the deploy rolls back
            trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource LapisBotInstance --region ${AWS::Region}' ERR

            useradd --system --home-dir /opt/lapis --shell /sbin/nologin lapis
            mkdir -p /opt/lapis/data /etc/lapis
            chown lapis:lapis /opt/lapis/data

            # settings the bot reads with os.getenv (the bot token is fetched separately, at start)
            cat > /etc/lapis/lapis.env <<'EOF'
            TABLE_NAME=${LapisTable}
            BUCKET_NAME=${LapisCodeAndImages}
            REGION_NAME=${AWS::Region}
            SECRET_NAME=${FernetSecretName}
            EXECUTABLE_NAME=./src/lapis/inputHandler
            SEED_CACHE=/opt/lapis/data/user_cache.db
            CACHE_TABLE=user_seeds
            EOF

            # start wrapper: the token goes straight from Secrets Manager into the process
            cat > /opt/lapis/run.sh <<'EOF'
            #!/bin/bash
            set -euo pipefail
            TOKEN=$(aws secretsmanager get-secret-value --region ${AWS::Region} \
              --secret-id ${LapisBotTokenSecret} --query SecretString --output text)
            export TOKEN
            cd /opt/lapis/app
            exec /opt/lapis/venv/bin/python -m src.lapis.lapis
            EOF

            # pulls the code deploy.sh uploaded and restarts the bot; deploy.sh runs it on every deploy
            cat > /opt/lapis/update.sh <<'EOF'
            #!/bin/bash
            set -euo pipefail
            exec 9>/run/lapis-update.lock; flock 9
            rm -rf /opt/lapis/next /tmp/lapis-bot.zip
            aws s3 cp --quiet --region ${AWS::Region} s3://${LapisCodeAndImages}/bot/lapis-bot.zip /tmp/lapis-bot.zip
            unzip -q /tmp/lapis-bot.zip -d /opt/lapis/next
            [ -x /opt/lapis/venv/bin/python ] || python3.11 -m venv /opt/lapis/venv
            /opt/lapis/venv/bin/pip install --quiet --disable-pip-version-check -r /opt/lapis/next/requirements.txt
            chmod +x /opt/lapis/next/src/lapis/inputHandler
            rm -rf /opt/lapis/app.old
            if [ -d /opt/lapis/app ]; then mv /opt/lapis/app /opt/lapis/app.old; fi
            mv /opt/lapis/next /opt/lapis/app
            systemctl restart lapis
            sleep 10
            # fails the deploy if the bot crashed on startup (bad token, import error...)
            systemctl is-active --quiet lapis || { journalctl -u lapis -n 40 --no-pager; exit 1; }
            echo "Lapis bot is running."
            EOF
            chmod 755 /opt/lapis/run.sh /opt/lapis/update.sh

            cat > /etc/systemd/system/lapis.service <<'EOF'
            [Unit]
            Description=Lapis Discord bot
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=lapis
            EnvironmentFile=/etc/lapis/lapis.env
            ExecStart=/opt/lapis/run.sh
            Restart=always
            RestartSec=10
            NoNewPrivileges=true
            PrivateTmp=true
            ProtectSystem=full

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable lapis

            /opt/lapis/update.sh
            /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource LapisBotInstance --region ${AWS::Region}

  LapisBotInstance:
    Type: AWS::EC2::Instance
    # the deploy waits until the bot is actually running (the cfn-signal at the end of UserData)
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LapisBotLaunchTemplate
        Version: !GetAtt LapisBotLaunchTemplate.LatestVersionNumber

Outputs:
  ApiUrl:
    Description: Base URL for the website's VITE_APP_API_ENDPOINT.
    Value: !Sub "https://${LapisApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  S3BucketName:
    Description: Images (uploads/) and Lambda code (lambda/).
    Value: !Ref LapisCodeAndImages
  DynamoDBTableName:
    Value: !Ref LapisTable
  BotInstanceId:
    Value: !Ref LapisBotInstance
  BotShellCommand:
    Description: Open a shell on the bot's instance (needs the Session Manager plugin for the AWS CLI).
    Value: !Sub "aws ssm start-session --region ${AWS::Region} --target ${LapisBotInstance}"
  BotLogsCommand:
    Description: Run on the instance to follow the bot's logs.
    Value: sudo journalctl -u lapis -f
